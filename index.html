<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>72</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #14181a;
    --chalk: #f4f1eb;
    --chalk-dim: #9aa19b;
    --amber: #cf8a2e;
  }

  *{ box-sizing: border-box; }

  html, body{ height: 100%; margin: 0; }

  body{
    background: var(--bg);
    color: var(--chalk);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    padding-top: calc(1.5rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }

  .wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  button.primary{
    appearance: none;
    border: none;
    cursor: pointer;
    background: var(--amber);
    color: #1a1200;
    font-family: "Anton", sans-serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    padding: 1.1rem 2.6rem;
    border-radius: 3px;
    letter-spacing: 0.01em;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button.primary:hover{ background: #e0993a; }
  button.primary:active{ transform: scale(0.97); }
  button.primary:focus-visible{ outline: 2px solid var(--chalk); outline-offset: 3px; }

  #count-screen{ display: none; }

  .days-figure{
    font-family: "Anton", "Arial Narrow", sans-serif;
    font-weight: 400;
    font-size: clamp(8rem, 50vw, 30rem);
    line-height: 0.8;
    color: var(--chalk);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .clock{
    font-family: "Anton", "Arial Narrow", sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.4rem, 5vw, 2.6rem);
    color: var(--chalk-dim);
    letter-spacing: 0.02em;
    margin-top: 0.5rem;
  }
  .clock span{ color: var(--amber); }

  #done-screen{ display: none; }
  #done-screen .days-figure{ color: var(--amber); }

  .reset{
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity: 0.5;
    margin-top: 2rem;
  }
  .reset:hover{ opacity: 1; }
  .reset:focus-visible{ outline: 2px solid var(--chalk-dim); outline-offset: 2px; }

</style>
</head>
<body>

  <div class="wrap">

    <section id="start-screen">
      <button class="primary" id="start-btn">Start</button>
    </section>

    <section id="count-screen">
      <p class="days-figure" id="days-figure" aria-live="polite">72</p>
      <p class="clock" id="clock-text">00 : 00 : 00</p>
      <button class="reset" id="reset-btn-active">reset</button>
    </section>

    <section id="done-screen">
      <p class="days-figure">0</p>
      <button class="reset" id="reset-btn-done">start again</button>
    </section>

  </div>

<script>
(function(){
  "use strict";

  var TOTAL_DAYS = 72;
  var STORAGE_KEY = "countdown72:target"; // stored as timestamp (ms) of the finish moment

  var els = {
    start: document.getElementById("start-screen"),
    count: document.getElementById("count-screen"),
    done: document.getElementById("done-screen"),
    startBtn: document.getElementById("start-btn"),
    daysFigure: document.getElementById("days-figure"),
    clockText: document.getElementById("clock-text")
  };

  function pad(n){ return String(n).padStart(2, "0"); }

  function showOnly(section){
    [els.start, els.count, els.done].forEach(function(s){
      s.style.display = (s === section) ? "flex" : "none";
    });
    section.style.flexDirection = "column";
    section.style.alignItems = "center";
  }

  function tick(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw){ showOnly(els.start); return; }

    var target = Number(raw);
    var remaining = target - Date.now();

    if (remaining <= 0){
      showOnly(els.done);
      return;
    }

    var days = Math.floor(remaining / 86400000);
    var hours = Math.floor((remaining % 86400000) / 3600000);
    var minutes = Math.floor((remaining % 3600000) / 60000);
    var seconds = Math.floor((remaining % 60000) / 1000);

    els.daysFigure.textContent = days;
    els.clockText.innerHTML =
      "<span>" + pad(hours) + "</span> : <span>" + pad(minutes) + "</span> : <span>" + pad(seconds) + "</span>";

    showOnly(els.count);
  }

  function start(){
    var tomorrow = new Date();
    tomorrow.setHours(0,0,0,0);
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setDate(tomorrow.getDate() + TOTAL_DAYS);
    localStorage.setItem(STORAGE_KEY, String(tomorrow.getTime()));
    tick();
  }

  function reset(){
    if (window.confirm("Reset the countdown?")){
      localStorage.removeItem(STORAGE_KEY);
      tick();
    }
  }

  els.startBtn.addEventListener("click", start);
  document.getElementById("reset-btn-active").addEventListener("click", reset);
  document.getElementById("reset-btn-done").addEventListener("click", reset);

  tick();
  setInterval(tick, 1000);

})();
</script>
</body>
</html>
